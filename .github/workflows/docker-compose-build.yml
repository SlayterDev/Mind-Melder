name: Docker Compose Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  docker-compose-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: |
          cp .env.example .env
          # Set minimal required environment variables for build
          echo "OPENAI_API_KEY=sk-test-key" >> .env
          echo "ANTHROPIC_API_KEY=sk-ant-test-key" >> .env

      - name: Build Docker Compose services
        run: docker compose build --no-cache

      - name: Verify images were created
        run: |
          docker images | grep mind-melder-api
          docker images | grep mind-melder-web

      - name: Start services
        run: docker compose up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to be healthy..."
          timeout 120 bash -c \
            'until docker compose ps | grep -q "healthy"; do sleep 5; done' \
            || {
              echo "Services failed to become healthy"
              docker compose ps
              docker compose logs
              exit 1
            }

      - name: Check service status
        run: docker compose ps

      - name: Test API health endpoint
        run: |
          # Wait a bit more for API to be fully ready
          sleep 10
          curl -f http://localhost:3000/health || {
            echo "API health check failed"
            docker compose logs api
            exit 1
          }

      - name: Test Web service
        run: |
          curl -f http://localhost:8080/ || {
            echo "Web service check failed"
            docker compose logs web
            exit 1
          }

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v
          docker system prune -af
